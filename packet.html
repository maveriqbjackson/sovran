<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;
  src:url(/fonts/archivo-var.woff2) format('woff2-variations'),url(/fonts/archivo-var.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:100 700;font-display:swap;
  src:url(/fonts/plex-sans-var.woff2) format('woff2-variations'),url(/fonts/plex-sans-var.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/plex-mono-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/plex-mono-500.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/plex-mono-600.woff2) format('woff2')}
:root{--void:#04060F; --void-2:#070B18; --surface:#0C1424; --surface-2:#131E38;
  --line:rgba(236,230,220,.13); --line-2:rgba(236,230,220,.24);
  --bone:#F4F0E8; --ash:#A2AEC6; --ash-dim:#74809B;
  --gold:#FFCB6B; --gold-hi:#FFEDC0; --gold-deep:#A87A22;
  --bif-1:#A878FF; --bif-2:#5AF0FF; --bif-3:#FFCB6B; --bif-4:#FF7ABE;
  --ice:#5AF0FF; --alarm:#FF9E5E; --clear:#3DE8A5;
  --r-lg:26px;--r-md:18px;--r-sm:11px;--pad:clamp(20px,5vw,32px);--maxw:740px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--void);color:var(--bone);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60ch 44ch at 82% 2%,rgba(123,92,214,.10),transparent 66%),
             radial-gradient(150ch 110ch at 50% 40%,transparent 44%,rgba(0,0,0,.5) 100%)}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
h1,h2,.mark{font-family:'Archivo',system-ui,sans-serif;text-transform:uppercase}
h1{font-weight:900;font-variation-settings:'wdth' 118;font-size:clamp(1.85rem,7vw,3.2rem);letter-spacing:-.012em;line-height:1.07}
h2{font-weight:900;font-variation-settings:'wdth' 114;font-size:clamp(1.25rem,4vw,1.75rem);line-height:1.16;margin-bottom:16px}
h3{font-family:'Archivo',sans-serif;font-weight:700;font-variation-settings:'wdth' 106;font-size:1.06rem;letter-spacing:-.015em;line-height:1.26}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.67rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.lede{font-size:clamp(1.02rem,3.2vw,1.2rem);color:var(--ash);line-height:1.58;max-width:58ch}
p.body{color:var(--ash);max-width:64ch;margin-bottom:16px}
strong{color:var(--bone);font-weight:600}
.gilt{background:linear-gradient(160deg,var(--gold-hi) 8%,var(--gold) 46%,var(--gold-deep) 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:relative;z-index:3;padding:22px 0 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{font-weight:900;font-size:1.18rem;letter-spacing:.16em;font-variation-settings:'wdth' 122;color:var(--bone);text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.bridge{width:21px;height:14px;flex:none;overflow:visible}
.back{font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);text-decoration:none;border-bottom:1px solid var(--line-2)}
.back:hover{color:var(--gold);border-color:var(--gold)}
.intro{padding:clamp(38px,8vw,64px) 0 clamp(20px,4vw,30px)}
.intro .eyebrow{display:block;margin-bottom:20px}
.intro .lede{margin-top:22px}
section{padding:0 0 clamp(38px,8vw,60px)}
.rule{height:1px;border:0;background:linear-gradient(90deg,transparent,var(--bif-1) 22%,var(--bif-2) 50%,var(--bif-3) 78%,transparent);opacity:.42;margin:clamp(34px,7vw,54px) 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(20px,4vw,28px);margin-bottom:14px}
.card p{color:var(--ash);font-size:.95rem;line-height:1.6}
.key{background:linear-gradient(140deg,rgba(217,174,95,.09),transparent 70%);border:1px solid rgba(217,174,95,.22);
  border-left:3px solid var(--gold);border-radius:var(--r-sm);padding:16px 18px;margin-bottom:18px;font-size:.92rem;color:var(--ash);line-height:1.58}
.key b{display:block;color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
.btn{border:0;border-radius:var(--r-sm);cursor:pointer;background:linear-gradient(165deg,var(--gold-hi),var(--gold) 58%,var(--gold-deep));
  color:#1E1403;font-family:'Archivo',sans-serif;font-weight:800;font-size:.88rem;text-transform:uppercase;letter-spacing:.09em;
  padding:15px 28px;transition:transform .12s,filter .18s,box-shadow .18s;display:inline-block;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.1);box-shadow:0 0 24px rgba(217,174,95,.26)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;border:1px solid var(--line-2);color:var(--ash);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);filter:none;box-shadow:none}
footer{border-top:1px solid var(--line);padding:36px 0 50px;font-size:.84rem;color:var(--ash-dim);background:var(--void-2)}
footer a{color:var(--ash);text-decoration:none;border-bottom:1px solid var(--line-2)}
footer a:hover{color:var(--gold);border-color:var(--gold)}

.pk{padding:clamp(34px,7vw,56px) 0 60px}
.pk .eyebrow{display:block;margin-bottom:16px}
.meta{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:var(--ash-dim);margin-top:14px}
.viewer{margin:26px 0 10px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#0A0F1C}
.viewer iframe{display:block;width:100%;height:min(72vh,780px);border:0;background:#fff}
.dl{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);text-decoration:none;border-bottom:1px solid var(--line-2)}
.dl:hover{color:var(--gold);border-color:var(--gold)}
.ck{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;margin:0 0 14px;color:var(--ash);font-size:.95rem;line-height:1.55;cursor:pointer}
.ck input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--gold)}
label.nm{display:block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px}
input.nm{width:100%;font:500 1.15rem 'IBM Plex Sans',sans-serif;color:var(--bone);background:var(--void-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:14px 16px}
input.nm:focus{outline:2px solid var(--gold);outline-offset:2px}
.sigprev{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.9rem;color:var(--gold-hi);min-height:2.4rem;margin:14px 0 4px;border-bottom:1px solid var(--line-2);padding-bottom:6px}
.err{color:var(--alarm);font-size:.92rem;margin:12px 0 0;min-height:1.2em}
.done{border-color:rgba(61,232,165,.35);background:linear-gradient(140deg,rgba(61,232,165,.08),transparent 70%)}
.done h2{color:var(--clear)}
.small{font-size:.84rem;color:var(--ash-dim);margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a href="/" class="mark">
      <svg class="bridge" viewBox="0 0 22 15" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" x2="1"><stop offset="0" stop-color="#A98CFF"/><stop offset=".5" stop-color="#6FE8FF"/><stop offset="1" stop-color="#E5BC6E"/></linearGradient></defs><path d="M1.5 13 Q11 2 20.5 13" stroke="url(#bg1)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      SOVRAN
    </a>
    <a href="/constitution" class="back">Our Constitution</a>
  </div>
</header>
<main class="wrap pk" id="app">
  <span class="eyebrow">Your packet</span>
  <h1>One moment<span class="gilt">.</span></h1>
  <p class="lede" style="margin-top:18px">Loading your packet…</p>
</main>
<footer><div class="wrap">SOVRAN · <a href="/charter.html">Charter</a> · <a href="/constitution">Constitution</a> · Nothing on this page tracks you. We don't record your location, device or internet address.</div></footer>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var t = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
  // Keep the private token out of the address bar history once it's read.
  try { if (t) history.replaceState(null, '', '/packet'); } catch (e) {}
  var api = '/api/packet/' + t;
  var app = $('#app');
  var when = function (s) { try { return new Date(s).toLocaleString('en-US', { timeZone: 'America/Denver', dateStyle: 'long', timeStyle: 'short' }) + ' Mountain'; } catch (e) { return s; } };
  function stop(title, text) { app.innerHTML = '<span class="eyebrow">Your packet</span><h1>' + title + '<span class="gilt">.</span></h1><p class="lede" style="margin-top:18px">' + text + '</p>'; }
  if (!/^[a-f0-9]{64}$/.test(t)) return stop('Link not found', 'This page needs the private link from your SOVRAN email. Open the email and tap <strong>Read and sign your packet</strong> again.');
  fetch(api, { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { return [r, j]; }); }).then(function (x) {
    var r = x[0], d = x[1];
    if (!r.ok) return stop('Link not found', esc(d.error || 'This link isn\'t valid. Ask SOVRAN to send a new one.'));
    if (d.state === 'expired') return stop('This link expired', 'For your privacy, signing links only work for 14 days. Reply to the SOVRAN email and we\'ll send a new one.');
    if (d.state === 'revoked') return stop('This link was turned off', 'A newer link may be in your inbox. If not, reply to the SOVRAN email and we\'ll send one.');
    if (d.state === 'signed') return signed(d);
    draw(d);
  }).catch(function () { stop('Couldn\'t load', 'Check your connection and try again.'); });

  function draw(d) {
    app.innerHTML =
      '<span class="eyebrow">Your packet · ' + esc(d.role) + '</span>' +
      '<h1>Hi ' + esc(d.first_name) + '<span class="gilt">.</span> Read, then sign.</h1>' +
      '<p class="lede" style="margin-top:18px">This is your SOVRAN packet: who we are, the Constitution, your role, the People-First Confidentiality Agreement and your first 30 days. Take your time. When you\'re ready, sign at the bottom. It takes about a minute.</p>' +
      '<p class="meta">' + esc(d.document) + ' · version ' + esc(d.version) + ' · link works until ' + esc(when(d.expires_at)) + '</p>' +
      '<div class="viewer"><iframe src="' + api + '/file#view=FitH" title="Your SOVRAN packet"></iframe></div>' +
      '<p><a class="dl" href="' + api + '/file" target="_blank" rel="noopener">Open the packet in a new tab ↗</a></p>' +
      '<hr class="rule">' +
      '<section class="card" id="signCard"><h2>Sign your packet</h2>' +
      '<label class="ck"><input type="checkbox" id="cE"><span><strong>I agree to sign electronically.</strong> My typed name below is my signature, the same as signing on paper. I can ask SOVRAN for a paper copy any time.</span></label>' +
      '<label class="ck"><input type="checkbox" id="cC"><span>I\'ve read the <strong>SOVRAN Constitution</strong> in this packet, and I agree to follow it.</span></label>' +
      '<label class="ck"><input type="checkbox" id="cA"><span>I agree to the <strong>People-First Confidentiality Agreement</strong> in this packet.</span></label>' +
      '<label class="nm" for="nm">Your full legal name</label><input class="nm" id="nm" autocomplete="name" maxlength="120" placeholder="First and last name">' +
      '<div class="sigprev" id="sp" aria-hidden="true"></div>' +
      '<p class="err" id="er" role="alert"></p>' +
      '<button class="btn" id="go" type="button" style="margin-top:8px">Sign the packet</button>' +
      '<p class="small">Tax and work-eligibility (I-9) forms aren\'t signed here: we\'ll do those on paper, in person. When you sign, SOVRAN keeps the signed packet with your name, the date and time, and the exact version you signed. We never record your location, device or internet address. A copy comes to your email.</p></section>';
    $('#nm').addEventListener('input', function () { $('#sp').textContent = this.value; });
    $('#go').addEventListener('click', function () {
      var b = this, name = $('#nm').value.replace(/\s+/g, ' ').trim(), er = $('#er');
      er.textContent = '';
      if (!$('#cE').checked) return (er.textContent = 'Tick the first box to agree to sign electronically.');
      if (!$('#cC').checked || !$('#cA').checked) return (er.textContent = 'Tick both boxes to agree to the Constitution and the Agreement.');
      if (name.length < 3 || name.indexOf(' ') < 0) return (er.textContent = 'Type your full legal name, first and last.');
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Tap again to sign as ' + name; return; }
      b.disabled = true; b.textContent = 'Signing…';
      fetch(api + '/sign', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name, consent: true, constitution: true, agreement: true }) })
        .then(function (r) { return r.json().then(function (j) { return [r, j]; }); })
        .then(function (x) { if (!x[0].ok) { er.textContent = x[1].error || 'That didn\'t go through. Nothing was signed; try again.'; b.disabled = false; b.dataset.sure = ''; b.textContent = 'Sign the packet'; return; } signed(x[1]); })
        .catch(function () { er.textContent = 'Couldn\'t reach SOVRAN. Nothing was signed; try again.'; b.disabled = false; b.dataset.sure = ''; b.textContent = 'Sign the packet'; });
    });
  }
  function signed(d) {
    app.innerHTML = '<span class="eyebrow">Your packet · ' + esc(d.role) + '</span><h1>Signed<span class="gilt">.</span> Thank you, ' + esc(d.first_name) + '.</h1>' +
      '<section class="card done" style="margin-top:28px"><h2>All done</h2><p>You signed as <strong>' + esc(d.signed_name) + '</strong> on ' + esc(when(d.signed_at)) + '. ' +
      (d.emailed === false ? 'Your signed copy is saved with SOVRAN; we\'ll send it to you shortly.' : 'Your signed copy is on its way to your email.') + '</p>' +
      '<p style="margin-top:12px"><a class="dl" href="' + api + '/file" target="_blank" rel="noopener">Download your signed copy ↗</a></p></section>' +
      '<p class="small">Next: we\'ll set a time to do your tax and work-eligibility forms in person. Questions? Reply to the SOVRAN email.</p>';
  }
})();
</script>
</body>
